name: Sign approved package metadata (artifact only)
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful Windows candidate workflow run ID
        required: true
      artifact_name:
        description: Exact candidate artifact name from that run
        required: true
      metadata_version:
        description: Next monotonically increasing TUF metadata version
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: orion-release-signing
  cancel-in-progress: false
jobs:
  sign:
    environment: orion-release-signing
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require a successful candidate acceptance run
        uses: actions/github-script@v7
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        with:
          script: |
            const id = process.env.CANDIDATE_RUN;
            if (!/^[1-9][0-9]*$/.test(id)) throw new Error('Invalid workflow run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: Number(id)
            });
            if (run.conclusion !== 'success' || run.path !== '.github/workflows/windows-packages.yml') {
              throw new Error('Only successful Windows candidate acceptance artifacts can be signed');
            }
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.9'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run }}
          name: ${{ inputs.artifact_name }}
          path: .tmp/approved-candidates
      - name: Load protected signing inputs
        env:
          ROOT_JSON: ${{ secrets.ORION_TUF_ROOT_JSON }}
          ROLE_KEYS_JSON: ${{ secrets.ORION_TUF_ROLE_KEYS_JSON }}
          METADATA_VERSION: ${{ inputs.metadata_version }}
        run: |
          if (-not $env:ROOT_JSON -or -not $env:ROLE_KEYS_JSON) { throw 'Production trust provisioning is required; no keys are generated by CI' }
          if ($env:METADATA_VERSION -notmatch '^[1-9][0-9]*$') { throw 'Positive metadata version required' }
          New-Item -ItemType Directory -Path .tmp/private -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD '.tmp/private/root.json'), $env:ROOT_JSON)
          $roles = $env:ROLE_KEYS_JSON | ConvertFrom-Json -AsHashtable
          $paths = @{}
          foreach ($role in @('targets','snapshot','timestamp')) {
            $paths[$role] = @{}
            foreach ($key in $roles[$role].Keys) {
              if ($key -notmatch '^[0-9a-f]{64}$') { throw 'Invalid signing key ID' }
              $path = Join-Path $PWD ".tmp/private/$role-$key.pem"
              [IO.File]::WriteAllText($path, $roles[$role][$key])
              $paths[$role][$key] = $path
            }
          }
          [IO.File]::WriteAllText((Join-Path $PWD '.tmp/private/keys.json'), ($paths | ConvertTo-Json -Depth 4))
      - name: Sign final bytes and assemble trusted installer
        env:
          METADATA_VERSION: ${{ inputs.metadata_version }}
        run: |
          uv venv .tmp/tools --python 3.11
          if ($LASTEXITCODE -ne 0) { throw 'Signing environment creation failed' }
          uv pip install --python .tmp/tools/Scripts/python.exe --require-hashes -r scripts/release/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Signing dependency installation failed' }
          $python = '.tmp/tools/Scripts/python.exe'
          & $python scripts/release/publish_metadata.py --artifacts .tmp/approved-candidates --output .tmp/signed --root .tmp/private/root.json --keys .tmp/private/keys.json --version $env:METADATA_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Metadata signing failed' }
          & $python scripts/release/download_inputs.py .tmp/inputs
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrap input verification failed' }
          & $python scripts/release/build_bootstrap.py --trusted-root .tmp/private/root.json --inputs .tmp/inputs --output .tmp/signed/Orion-Installer.zip
          if ($LASTEXITCODE -ne 0) { throw 'Trusted installer assembly failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows-metadata-${{ inputs.metadata_version }}
          path: .tmp/signed/
          if-no-files-found: error
      # Offline root keys never enter CI. No upload to a release server, no
      # automatic update enablement, and no Authenticode claim is made here.

services:
  tts:
    build:
      context: ../../
      dockerfile: services/tts/Dockerfile
      args:
        - "ENGINE_NAME=${ENGINE_NAME}"
        - "BASE_IMAGE=${BASE_IMAGE}"
    image: orion-tts:local
    shm_size: '8gb'

    container_name: ${TTS_HOST}
    ports:
      - "${ORION_SERVICES_BIND_HOST:-127.0.0.1}:${TTS_PORT}:${TTS_CONTAINER_PORT}"
    env_file:
      - ../.env.global
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      # Inside the container it listens everywhere; the host port above decides who reaches it.
      - ORION_SERVICES_BIND_HOST=0.0.0.0
      - NVIDIA_VISIBLE_DEVICES=${GPU_DEVICE_IDS:-all}
    volumes:
      - ./models:/app/models
      - ./voices:/app/voices
    networks:
      - orion-network
    restart: unless-stopped

networks:
  orion-network:
    external: true
    name: ${ORION_NETWORK}

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "orion-hub"
version = "0.1.0"
description = "Stateless API + fake worker scaffold for Orion"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "redis>=5.0.0",
  "pydantic-settings>=2.2.1",
  "aiohttp>=3.10.0",
  "av>=18.1,<19",
  "asyncpg>=0.29.0",
  "bcrypt>=4.0.0",
  "PyJWT>=2.8.0",
  "tzdata>=2024.1",
  "qrcode[pil]>=8.2,<9",
  "cryptography>=43.0.0",
  "ddgs>=9.0,<10",
  "zeroconf>=0.151.0,<1",
  "psutil>=5.9,<8",
  # Echo cancellation for the PC microphone mode (Windows loopback reference only).
  "numpy>=1.26",
  "ai-edge-litert>=2.3,<3; sys_platform == 'win32'",
  "PyAudioWPatch>=0.2.12.9,<0.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Compatibility extra: browser tools now use the existing aiohttp dependency.
google-ai = []
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orion"]

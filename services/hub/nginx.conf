events {}

http {
    upstream api_backend {
        server public_api:8909;
        server api_2:8909;
        keepalive 32;
    }

    server {
        listen 80 ssl;
        ssl_certificate /etc/orion-security/hub-cert.pem;
        ssl_certificate_key /etc/orion-security/hub-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass https://api_backend;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/orion-security/hub-cert.pem;
            proxy_ssl_name localhost;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
